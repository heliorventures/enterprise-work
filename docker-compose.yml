services:
  postgres:
    image: postgres:16-alpine
    container_name: wmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wmp
      POSTGRES_PASSWORD: wmp_dev_password
      POSTGRES_DB: work_management
    ports:
      - "5434:5432"
    volumes:
      - wmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wmp -d work_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: wmp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wmp:wmp_dev_password@postgres:5432/work_management
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret-min-32-characters-ok}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-min-32-characters}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
      FILE_STORAGE_PATH: /app/uploads
      MAX_FILE_SIZE: 10485760
      NODE_ENV: production
    ports:
      - "3001:3001"
    volumes:
      - wmp_uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api
        VITE_WS_URL: http://localhost:3001
    container_name: wmp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  wmp_pgdata:
  wmp_uploads:
